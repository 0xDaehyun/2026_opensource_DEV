services:
  stock-mock-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-mock-server:local
    ports:
      - "8080:8080"
    environment:
      MOCK_ACCOUNT_INITIAL_CASH: ${MOCK_ACCOUNT_INITIAL_CASH:-10000000}
      MOCK_FILL_RATIO: ${MOCK_FILL_RATIO:-0.3}
      MOCK_FILL_DELAY: ${MOCK_FILL_DELAY:-5s}
      MOCK_TOKEN_TTL: ${MOCK_TOKEN_TTL:-24h}
    restart: unless-stopped
